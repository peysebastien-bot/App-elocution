<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond -->
  <rect width="192" height="192" fill="#1a1a1a" rx="45"/>

  <!-- Cercle accentué -->
  <circle cx="96" cy="96" r="75" fill="none" stroke="#c9956b" stroke-width="2" opacity="0.3"/>

  <!-- Microphone stylisé -->
  <g transform="translate(96, 96)">
    <!-- Capsule du micro -->
    <rect x="-18" y="-35" width="36" height="40" rx="18" fill="#c9956b"/>

    <!-- Onde sonore 1 -->
    <path d="M -35 -10 Q -40 -20 -35 -30" stroke="#c9956b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Onde sonore 2 -->
    <path d="M 35 -10 Q 40 -20 35 -30" stroke="#c9956b" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Pied du micro -->
    <rect x="-8" y="8" width="16" height="35" rx="8" fill="#c9956b" opacity="0.7"/>

    <!-- Texte stylisé (S pour "Speech") -->
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">S</text>
  </g>
</svg>
